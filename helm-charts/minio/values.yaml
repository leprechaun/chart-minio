# Default values for minio.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: pgsty/silo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "RELEASE.2026-09-03T13-18-01Z-distroless"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000


service:
  server:
    type: ClusterIP
    port: 80
    container: 9000
  ui:
    type: ClusterIP
    port: 8080
    container: 9001

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: api.chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
          backend:
            service:
              port:
                number: 9000
    - host: console.chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
          backend:
            service:
              port:
                number: 9001

  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - s3-api.local
  #      - s3-console.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi


nodeSelector: {}

tolerations: []

affinity: {}

config:
  env:
    MINIO_CONSOLE_ADDRESS: ":9001"
    #MINIO_BROWSER_REDIRECT_URL: http://console.chart-example.local
  secrets:
    MINIO_ROOT_USER: admin
    MINIO_ROOT_PASSWORD: password
