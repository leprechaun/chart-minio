{{- if .Values.httproute.enabled -}}
{{- $fullName := include "minio.fullname" . -}}
{{- $root := . -}}
{{- range .Values.httproute.hosts }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-{{ .host | replace "." "-" }}
  labels:
    {{- include "minio.labels" $root | nindent 4 }}
  {{- with $root.Values.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml $root.Values.httproute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .host | quote }}
  rules:
    {{- range .paths }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .backend.service.port.number }}
    {{- end }}
{{- end }}
{{- end }}
